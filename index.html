<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Operation: Signal & Lore • Gamified ELA Foundations</title>
<style>
:root {
  --bg-dark: #0f172a;
  --panel-bg: #1e293b;
  --panel-border: #334155;
  --accent-gold: #f59e0b;
  --accent-teal: #06b6d4;
  --accent-green: #10b981;
  --accent-red: #ef4444;
  --text-main: #f8fafc;
  --text-muted: #94a3b8;
  --card-bg: #0f172a;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg-dark);
  color: var(--text-main);
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  line-height: 1.6;
}

/* GAMIFIED HUD HEADER */
header {
  background: #090d16;
  border-bottom: 3px solid var(--accent-teal);
  padding: 16px max(20px, calc((100vw - 1000px)/2));
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 4px 20px rgba(0,0,0,0.5);
}

.hud-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
}

.game-title {
  font-size: 1.2rem;
  font-weight: 800;
  color: var(--accent-teal);
  letter-spacing: 1px;
  text-transform: uppercase;
  display: flex;
  align-items: center;
  gap: 8px;
}

.hud-stats {
  display: flex;
  align-items: center;
  gap: 16px;
  background: rgba(255,255,255,0.05);
  padding: 6px 16px;
  border-radius: 20px;
  border: 1px solid var(--panel-border);
}

.stat-box {
  display: flex;
  align-items: center;
  gap: 6px;
  font-weight: bold;
  font-size: 0.95rem;
}

.stat-label { color: var(--text-muted); font-size: 0.8rem; text-transform: uppercase; }

.xp-bar-container {
  margin-top: 10px;
  background: #1e293b;
  border-radius: 8px;
  height: 12px;
  overflow: hidden;
  border: 1px solid var(--panel-border);
  position: relative;
}

.xp-bar-fill {
  background: linear-gradient(90deg, var(--accent-teal), var(--accent-gold));
  height: 100%;
  width: 0%;
  transition: width 0.4s ease;
}

/* MAIN CONTENT LAYOUT */
main {
  max-width: 1000px;
  margin: 20px auto;
  padding: 0 16px;
}

.daypicker {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 16px;
}

.daypicker button {
  background: #1e293b;
  color: var(--text-muted);
  border: 1px solid var(--panel-border);
  border-radius: 8px;
  padding: 10px 16px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s ease;
}

.daypicker button:hover {
  border-color: var(--accent-teal);
  color: var(--text-main);
}

.daypicker button.active {
  background: var(--accent-teal);
  color: #000;
  border-color: var(--accent-teal);
}

nav {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 20px;
}

nav button {
  font-size: 13px;
  font-weight: 600;
  background: var(--panel-bg);
  color: var(--text-muted);
  border: 1px solid var(--panel-border);
  border-radius: 6px;
  padding: 8px 12px;
  cursor: pointer;
  transition: 0.2s;
}

nav button:hover { background: #334155; color: white; }
nav button.current {
  background: var(--accent-gold);
  color: #000;
  border-color: var(--accent-gold);
  font-weight: 800;
}

/* PANEL CARD */
.panel {
  background: var(--panel-bg);
  border: 2px solid var(--panel-border);
  border-radius: 16px;
  padding: clamp(20px, 4vw, 36px);
  box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  margin-bottom: 20px;
}

h2 { color: var(--accent-gold); margin-top: 0; line-height: 1.3; font-size: 1.6rem; }
h3 { color: var(--accent-teal); margin-top: 24px; font-size: 1.25rem; }

/* QUEST CARDS & CALLOUTS */
.callout {
  background: rgba(245, 158, 11, 0.1);
  border-left: 4px solid var(--accent-gold);
  padding: 16px 20px;
  border-radius: 0 10px 10px 0;
  margin: 20px 0;
}

.passage {
  background: var(--card-bg);
  border: 1px solid var(--panel-border);
  padding: 20px;
  border-radius: 12px;
  margin: 20px 0;
}

.badge {
  display: inline-block;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 1px;
  font-weight: 800;
  color: #000;
  background: var(--accent-teal);
  padding: 3px 8px;
  border-radius: 4px;
  margin-bottom: 8px;
}

/* QUESTIONS & OPTIONS */
.question {
  border-top: 1px solid var(--panel-border);
  margin-top: 24px;
  padding-top: 20px;
}

.option {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  border: 1px solid var(--panel-border);
  background: var(--card-bg);
  border-radius: 8px;
  margin: 8px 0;
  cursor: pointer;
  transition: 0.2s ease;
}

.option:hover {
  border-color: var(--accent-teal);
  background: rgba(6, 182, 212, 0.05);
}

.option:has(input:checked) {
  background: rgba(6, 182, 212, 0.15);
  border-color: var(--accent-teal);
}

input[type=radio], input[type=checkbox] {
  width: 18px;
  height: 18px;
  accent-color: var(--accent-teal);
  cursor: pointer;
}

/* INPUTS & TEXTAREAS */
input[type=text], textarea {
  width: 100%;
  padding: 12px;
  background: var(--card-bg);
  border: 1px solid var(--panel-border);
  border-radius: 8px;
  color: var(--text-main);
  font-family: inherit;
  font-size: 1rem;
  margin-top: 6px;
}

input[type=text]:focus, textarea:focus {
  outline: none;
  border-color: var(--accent-teal);
  box-shadow: 0 0 8px rgba(6, 182, 212, 0.3);
}

label.writing {
  display: block;
  font-weight: 600;
  margin: 20px 0;
  color: var(--accent-gold);
}

/* BUTTONS */
button.action-btn, button.check {
  font-family: inherit;
  font-weight: 700;
  background: var(--accent-teal);
  color: #000;
  border: 0;
  border-radius: 8px;
  padding: 10px 18px;
  cursor: pointer;
  transition: all 0.2s;
  margin: 10px 6px 10px 0;
}

button.action-btn:hover, button.check:hover {
  filter: brightness(1.15);
  transform: translateY(-1px);
}

button:disabled {
  opacity: 0.4;
  cursor: not-allowed;
  transform: none !important;
}

/* FEEDBACK & TABLES */
.feedback {
  padding: 12px 16px;
  border-radius: 8px;
  display: none;
  margin-top: 12px;
  font-size: 0.95rem;
}

.feedback.correct-fb {
  background: rgba(16, 185, 129, 0.15);
  border: 1px solid var(--accent-green);
  color: #6ee7b7;
}

.feedback.incorrect-fb {
  background: rgba(239, 68, 68, 0.15);
  border: 1px solid var(--accent-red);
  color: #fca5a5;
}

table {
  width: 100%;
  border-collapse: collapse;
  margin: 16px 0;
  font-size: 15px;
}

th, td {
  padding: 10px 14px;
  text-align: left;
  border: 1px solid var(--panel-border);
}

th { background: rgba(255,255,255,0.05); color: var(--accent-teal); }

.footer {
  display: flex;
  justify-content: space-between;
  margin-top: 20px;
}

.dailyreport, #report {
  white-space: pre-wrap;
  background: var(--card-bg);
  border: 1px solid var(--panel-border);
  padding: 18px;
  margin-top: 20px;
  border-radius: 8px;
  font-family: monospace;
  color: var(--accent-gold);
}

.dailyreport:empty, #report:empty { display: none; }

@media(max-width: 600px) {
  .hud-top { flex-direction: column; align-items: flex-start; }
  .hud-stats { width: 100%; justify-content: space-between; }
  td, th { padding: 6px; font-size: 13px; }
}

@media print {
  header, nav, .footer, .daypicker, button { display: none !important; }
  body { background: white; color: black; }
  .panel { border: none; box-shadow: none; padding: 0; }
  #report, .dailyreport { color: black; background: white; border: 1px solid #ccc; }
}
</style>
</head>

// SFX ENGINE (Web Audio API)
const AudioContext = window.AudioContext || window.webkitAudioContext;
let audioCtx;

function initAudio() { if (!audioCtx) audioCtx = new AudioContext(); }

function playSound(type) {
  try {
    initAudio();
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    if (type === 'correct') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
      osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1); // E5
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.3);
    } else if (type === 'incorrect') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(180, audioCtx.currentTime);
      osc.frequency.setValueAtTime(110, audioCtx.currentTime + 0.15);
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.3);
    } else if (type === 'levelUp') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(440, audioCtx.currentTime);
      osc.frequency.setValueAtTime(880, audioCtx.currentTime + 0.2);
      gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.5);
    }
  } catch(e) {}
}

    "body": "<h2>Mission 1: Codebreakers • Directives</h2><p><b>Target Protocols:</b> ELA.6.V.1.1 and ELA.6.V.1.2[cite: 1]</p><div class=\"callout\"><b>Mission Objectives:</b><ul><li>Decode core command directive terms[cite: 1].</li><li>Deploy academic vocabulary across written transmissions[cite: 1].</li><li>Use Greek/Latin roots & affixes to scan and unlock word meanings[cite: 1].</li></ul></div><p>Follow command briefs carefully. Pause at <b>PRACTICE RUNS</b>[cite: 1]. Execute solo operations at <b>SOLO MISSIONS</b>[cite: 1]. Submit answers to gain XP and level up!</p><label>Agent Codename <input id=\"student\" placeholder=\"Enter operative name...\"></label><h2>DATA SCAN: Command Words</h2><p>Command words unlock exact mission requirements[cite: 1]:</p><table><tr><th>Directive</th><th>Decoded Meaning</th><th>Required Transmission Output</th></tr><tr><td>Analyze</td><td>Examine parts and structural connections[cite: 1].</td><td>Explain how a detail builds overall text meaning[cite: 1].</td></tr><tr><td>Interpret</td><td>Decode underlying meaning[cite: 1].</td><td>Explain what details, visuals, or outcomes suggest[cite: 1].</td></tr><tr><td>Evidence</td><td>Verifiable proof backing a claim[cite: 1].</td><td>Cite a specific quotation, detail, or observation[cite: 1].</td></tr><tr><td>Infer</td><td>Reach a logically supported, unstated conclusion[cite: 1].</td><td>Combine evidence clues with logical reasoning[cite: 1].</td></tr><tr><td>Compare / Contrast</td><td>Identify similarities / differences[cite: 1].</td><td>Evaluate both targets using a shared point of comparison[cite: 1].</td></tr><tr><td>Justify</td><td>Defend a decision or claim[cite: 1].</td><td>Explain precisely why evidence supports your choice[cite: 1].</td></tr></table><div class=\"passage\"><p><i>“Leah held her completed speech behind her back. When her name was called, she asked whether someone else could go first.”</i>[cite: 1]</p><p><b>Diagnostic Scan:</b> I infer Leah may feel nervous[cite: 1]. My evidence is her request to delay speaking despite having a finished draft[cite: 1]. This evidence supports nervousness better than claiming she forgot her work[cite: 1]. I use “may” because feelings aren't stated directly[cite: 1].</p></div><div class=\"callout\"><b>Shield Rule:</b> Don't just point to evidence—explain how it works[cite: 1]!</div><div class=\"question\" data-id=\"q1\" data-answer=\"1\" data-why=\"Analysis examines specific parts to explain their relationship to the text's overall meaning[cite: 1].\"><span class=\"badge\">Task Q1 (+10 XP)</span><h3>What does “analyze how the ending affects the reader’s understanding” require you to do[cite: 1]?</h3><label class=\"option\"><input type=\"radio\" name=\"q1\" value=\"0\"> Copy the last sentence only[cite: 1].</label><label class=\"option\"><input type=\"radio\" name=\"q1\" value=\"1\"> Explain the relationship between the ending and the text's core meaning[cite: 1].</label><label class=\"option\"><input type=\"radio\" name=\"q1\" value=\"2\"> List the characters without explanation[cite: 1].</label><label class=\"option\"><input type=\"radio\" name=\"q1\" value=\"3\"> State whether you liked the story[cite: 1].</label><button class=\"check\">Check Signal</button><p class=\"feedback\" aria-live=\"polite\"></p></div><div class=\"question\" data-id=\"q2\" data-answer=\"2\" data-why=\"This response cites specific evidence and logical inference without making unsupported claims[cite: 1].\"><span class=\"badge\">Task Q2 (+10 XP)</span><h3>Which transmission deploys evidence most effectively[cite: 1]?</h3><label class=\"option\"><input type=\"radio\" name=\"q2\" value=\"0\"> Leah is nervous because I said so[cite: 1].</label><label class=\"option\"><input type=\"radio\" name=\"q2\" value=\"1\"> Leah is definitely never prepared[cite: 1].</label><label class=\"option\"><input type=\"radio\" name=\"q2\" value=\"2\"> Leah may feel nervous because she asks another student to speak first even though her speech is     "title": "M1 • Root Scanner",
    "body": "<h2>DATA SCAN: Word-Part Alchemy</h2><p>Words hold internal clues[cite: 1]. A <b>root</b> contains core meaning; a <b>prefix</b> comes before, and a <b>suffix</b> attaches after[cite: 1].</p><table><tr><th>Component</th><th>Core Meaning</th><th>Example Words</th></tr><tr><td>graph (Greek)</td><td>write / record[cite: 1]</td><td>autograph, biography[cite: 1]</td></tr><tr><td>bio (Greek)</td><td>life[cite: 1]</td><td>biography, biology[cite: 1]</td></tr><tr><td>auto (Greek)</td><td>self[cite: 1]</td><td>autobiography[cite: 1]</td></tr><tr><td>spect (Latin)</td><td>look / see[cite: 1]</td><td>inspect, spectator[cite: 1]</td></tr><tr><td>port (Latin)</td><td>carry[cite: 1]</td><td>transport, portable[cite: 1]</td></tr><tr><td>re- (prefix)</td><td>again / back[cite: 1]</td><td>reread, rebuild[cite: 1]</td></tr><tr><td>pre- (prefix)</td><td>before[cite: 1]</td><td>preview, pretest[cite: 1]</td></tr><tr><td>-able (suffix)</td><td>able to be[cite: 1]</td><td>portable, readable[cite: 1]</td></tr><tr><td>-er / -or (suffix)</td><td>person who performs action[cite: 1]</td><td>reader, spectator[cite: 1]</td></tr></table><div class=\"callout\"><b>3-Step Protocol: Break → Predict → Check</b>[cite: 1]<ol><li>Break words into recognizable parts[cite: 1].</li><li>Predict meaning from isolated components[cite: 1].</li><li>Check context to confirm accurate whole-word fit[cite: 1].</li></ol></div><div class=\"question\" data-id=\"q4\" data-answer=\"1\" data-why=\"Prefix re- means again; context supports reading a second time[cite: 1].\"><span class=\"badge\">Task Q4 (+10 XP)</span><h3>Which meaning best fits: “The students reread the confusing paragraph”[cite: 1]?</h3><label class=\"option\"><input type=\"radio\" name=\"q4\" value=\"0\"> Read before it is written[cite: 1].</label><label class=\"option\"><input type=\"radio\" name=\"q4\" value=\"1\"> Read again[cite: 1].</label><label class=\"option\"><input type=\"radio\" name=\"q4\" value=\"2\"> Carry the paragraph[cite: 1].</label><label class=\"option\"><input type=\"radio\" name=\"q4\" value=\"3\"> Look away from it[cite: 1].</label><button class=\"check\">Check Signal</button><p class=\"feedback\" aria-live=\"polite\"></p></div><div class=\"question\" data-id=\"q5\" data-answer=\"2\" data-why=\"Spect relates to looking/seeing; a spectator is one who watches[cite: 1].\"><span class=\"badge\">Task Q5 (+10 XP)</span><h3>A spectator watches a match. Which root unlocks this meaning[cite: 1]?</h3><label class=\"option\"><input type=\"radio\" name=\"q5\" value=\"0\"> port: carry[cite: 1]</label><label class=\"option\"><input type=\"radio\" name=\"q5\" value=\"1\"> bio: life[cite: 1]</label><label class=\"option\"><input type=\"radio\" name=\"q5\" value=\"2\"> spect: look / see[cite: 1]</label><label class=\"option\"><input type=\"radio\" name=\"q5\" value=\"3\"> graph: write[cite: 1]</label><button class=\"check\">Check Signal</button><p class=\"feedback\" aria-live=\"polite\"></p></div><div class=\"question\" data-id=\"q6\" data-answer=\"3\" data-why=\"When predictions fail contextual verification, evaluate sentence clues and reference tools[cite: 1].\"><span class=\"badge\">Task Q6 (+10 XP)</span><h3>What is the optimal move when a root prediction fails to fit context[cite: 1]?</h3><label class=\"option\"><input type=\"radio\" name=\"q6\" value=\"0\"> Force the prediction regardless[cite: 1].</label><label class=\"option\"><input type=\"radio\" name=\"q6\" value=\"1\"> Ignore the word entirely[cite: 1].</label><label class=\"option\"><input type=\"radio\" name=\"q6\" value=\"2\"> Select the longest dictionary definition[cite: 1].</label><label class=\"option\"><input type=\"radio\" name=\"q6\" value=\"3\"> Check context clues and consult a reliable reference[cite: 1].</label><button class=\"check\">Check Signal</button><p class=\"feedback\" aria-live=\"polite\"></p></div><label class=\"writing\">SIDE-QUEST (+25 XP): Explain “preview” in “Before reading, we previewed the headings”[cite: 1]. Identify prefix, state meaning, and verify context[cite: 1].<textarea id=\"d1guided\" rows=\"3\" placeholder=\"Write your transmission...\"></textarea></label>"

// GAME STATE MANAGEMENT
let page = 0, answers = {}, checks = {}, fields = {}, seconds = 0, xp = 0;
const KEY = 'operation_signal_lore_v2';

try {
  const s = JSON.parse(localStorage.getItem(KEY) || 'null');
  if (s) {
    page = s.page || 0;
    answers = s.answers || {};
    checks = s.checks || {};
    fields = s.fields || {};
    seconds = s.seconds || 0;
  }
} catch(e){}

function save() {
  try {
    localStorage.setItem(KEY, JSON.stringify({ page, answers, checks, fields, seconds }));
  } catch(e){}
  updateHUD();
}

function calculateXP() {
  let earnedXP = 0;
  // Calculate checked correct questions (10 XP each)
  Object.keys(checks).forEach(id => {
    if (checks[id] && checks[id].correct) earnedXP += 10;
  });
  // Calculate filled writing fields (25 XP each)
  const writingIds = ["d1guided", "d1apply", "d1exit", "d2guided", "d2apply", "d2exit", "d3apply", "d3exit"];
  writingIds.forEach(id => {
    if (fields[id] && fields[id].trim().length > 10) earnedXP += 25;
  });
  return earnedXP;
}

function updateHUD() {
  xp = calculateXP();
  document.getElementById('xp-display').textContent = xp;
  
  // Calculate Level & Rank
  let rank = "Cadet";
  let badges = "🛡️";
  if (xp >= 50 && xp < 120) { rank = "Decrypter"; badges = "🛡️ 🔍"; }
  else if (xp >= 120 && xp < 200) { rank = "Archivist"; badges = "🛡️ 🔍 📜"; }
  else if (xp >= 200) { rank = "Master Operative"; badges = "🛡️ 🔍 📜 ⚡"; }
  
  document.getElementById('rank-display').textContent = rank;
  document.getElementById('badge-display').textContent = badges;

  // XP Progress fill
  const maxXP = 300;
  const fillPct = Math.min(100, Math.floor((xp / maxXP) * 100));
  document.getElementById('xp-bar').style.width = fillPct + '%';
}

function capture() {
  document.querySelectorAll('#panel input[type=radio], #panel input[type=checkbox]').forEach(el => {
    if (!answers[el.name]) answers[el.name] = [];
  });
  document.querySelectorAll('.question').forEach(el => {
    answers[el.dataset.id] = [...el.querySelectorAll('input:checked')].map(x => +x.value);
  });
  document.querySelectorAll('#panel textarea, #student').forEach(el => {
    fields[el.id] = el.value;
  });
  save();
}

function render() {
  document.getElementById('panel').innerHTML = '<span class="badge">Sector ' + (page + 1) + ' of 12</span>' + sections[page].body;
  
  // Render sub-navigation
  const startIdx = Math.floor(page / 4) * 4;
  document.getElementById('nav').innerHTML = sections.map((s, i) => {
    if (i >= startIdx && i < startIdx + 4) {
      return '<button class="' + (i === page ? 'current' : '') + '" data-page="' + i + '">' + (i + 1) + '. ' + s.title + '</button>';
    }
    return '';
  }).join('');

  // Update Day Picker buttons
  document.querySelectorAll('.daypicker button').forEach((btn, idx) => {
    const btnStart = +btn.dataset.start;
    btn.classList.toggle('active', page >= btnStart && page < btnStart + 4);
  });

  document.getElementById('back').disabled = page === 0;
  document.getElementById('next').disabled = page === 11;

  // Restore checks & text
  document.querySelectorAll('#panel input[type=radio], #panel input[type=checkbox]').forEach(el => {
    el.checked = (answers[el.name] || []).includes(+el.value);
  });
  document.querySelectorAll('#panel textarea, #student').forEach(el => {
    el.value = fields[el.id] || '';
  });
  document.querySelectorAll('.question').forEach(el => {
    if (checks[el.dataset.id]) showFeedback(el);
  });

  save();
}

function showFeedback(el) {
  const c = checks[el.dataset.id];
  const f = el.querySelector('.feedback');
  if (!f) return;
  f.style.display = 'block';
  if (c.correct) {
    f.className = 'feedback correct-fb';
    f.textContent = '⚡ SIGNAL VERIFIED. ' + el.dataset.why;
  } else {
    f.className = 'feedback incorrect-fb';
    f.textContent = '❌ SIGNAL INTERRUPTED. ' + el.dataset.why + ' Valid choice(s): ' + 
      el.dataset.answer.split(',').map(v => el.querySelector('input[value="' + v + '"]').parentElement.textContent.trim()).join(' | ');
  }
}

// EVENT LISTENERS
document.addEventListener('input', e => {
  if (e.target.closest('#panel')) {
    if (e.target.name) {
      delete checks[e.target.name];
      const qEl = e.target.closest('.question');
      if (qEl) {
        const f = qEl.querySelector('.feedback');
        if (f) f.style.display = 'none';
      }
    }
    capture();
  }
});

document.addEventListener('click', e => {
  if (e.target.dataset.page !== undefined) {
    capture();
    page = +e.target.dataset.page;
    render();
    window.scrollTo(0, 0);
  }

  if (e.target.classList.contains('check')) {
    capture();
    let el = e.target.closest('.question');
    let got = answers[el.dataset.id] || [];
    let wanted = el.dataset.answer.split(',').map(Number);
    
    const fb = el.querySelector('.feedback');
    if (!got.length) {
      fb.style.display = 'block';
      fb.className = 'feedback incorrect-fb';
      fb.textContent = '⚠️ Select an option before running verification.';
      return;
    }

    const isCorrect = got.length === wanted.length && wanted.every(v => got.includes(v));
    checks[el.dataset.id] = { correct: isCorrect };
    
    if (isCorrect) playSound('correct');
    else playSound('incorrect');

    showFeedback(el);
    save();
  }

  if (e.target.id === 'reportBtn') makeReport();
  if (e.target.id === 'printBtn') { makeReport(); window.print(); }
  if (e.target.id === 'downloadBtn') {
    const txt = makeReport();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([txt], { type: 'text/plain' }));
    a.download = 'Operation-Signal-Lore-Campaign-Dossier.txt';
    a.click();
  }
});

document.getElementById('back').onclick = () => { capture(); page--; render(); window.scrollTo(0,0); };
document.getElementById('next').onclick = () => { capture(); page++; render(); window.scrollTo(0,0); };

function makeReport() {
  capture();
  const ids = Array.from({ length: 30 }, (_, i) => 'q' + (i + 1));
  const written = ["d1guided", "d1apply", "d1exit", "d2guided", "d2apply", "d2exit", "d3apply", "d3exit"];
  const done = ids.filter(id => checks[id]).length;
  const correct = ids.filter(id => checks[id]?.correct).length;
  const w = written.filter(id => (fields[id] || '').trim()).length;
  
  let t = 'OPERATION: SIGNAL & LORE • CAMPAIGN DOSSIER\n';
  t += 'Operative Codename: ' + (fields.student || '[Unregistered Operative]') + '\n';
  t += 'Earned XP: ' + xp + ' | Rank: ' + document.getElementById('rank-display').textContent + '\n';
  t += 'Timestamp: ' + new Date().toLocaleString() + '\n';
  t += 'Practice Checked: ' + done + '/30 | Accuracy: ' + correct + '/30\n';
  t += 'Written Submissions: ' + w + '/8 completed\n';
  t += '--------------------------------------------------\n';
  
  written.forEach(id => {
    t += '\nTRANSMISSION [' + id.toUpperCase() + ']:\n' + (fields[id] || '[No transmission recorded]');
  });

  document.getElementById('report').textContent = t;
  return t;
}

// DAILY REPORTING & NAVIGATION
const dayFields = [
  ["d1guided", "d1apply", "d1exit"],
  ["d2guided", "d2apply", "d2exit"],
  ["d3apply", "d3exit"]
];

function dayReport(day) {
  capture();
  const written = dayFields[day - 1];
  const w = written.filter(id => (fields[id] || '').trim()).length;
  let t = 'MISSION ' + day + ' LOG • SIGNAL & LORE\n';
  t += 'Operative: ' + (fields.student || '[Unregistered]') + '\n';
  t += 'Timestamp: ' + new Date().toLocaleString() + '\n';
  t += 'Written Tasks: ' + w + '/' + written.length + '\n';
  written.forEach(id => {
    t += '\n' + id.toUpperCase() + ':\n' + (fields[id] || '[Missing]');
  });
  document.getElementById('dailyreport' + day).textContent = t;
  return t;
}

document.addEventListener('click', e => {
  if (e.target.dataset.start !== undefined) {
    capture();
    page = +e.target.dataset.start;
    render();
    window.scrollTo(0, 0);
  }
  if (e.target.classList.contains('dayreport')) dayReport(+e.target.dataset.day);
  if (e.target.classList.contains('daydownload')) {
    const day = +e.target.dataset.day;
    const txt = dayReport(day);
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([txt], { type: 'text/plain' }));
    a.download = 'Mission-' + day + '-Log.txt';
    a.click();
  }
  if (e.target.classList.contains('dayprint')) {
    const day = +e.target.dataset.day;
    dayReport(day);
    window.print();
  }
});

setInterval(() => {
  if (!document.hidden) {
    seconds++;
    if (seconds % 10 === 0) save();
  }
}, 1000);

render();
</script>
</body>
</html>
